name: Appi CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/appi/**'
      - '.github/workflows/appi.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/appi/**'

defaults:
  run:
    working-directory: apps/appi

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: appi_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/appi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Copy .env
        run: cp .env.example .env

      - name: Run migrations
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: password
          DB_DATABASE: appi_test
          APP_KEY: test-key-for-ci-only-not-used-in-prod
        run: node ace migration:run --force

      - name: Run tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: password
          DB_DATABASE: appi_test
          APP_KEY: test-key-for-ci-only-not-used-in-prod
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # El proyecto usa Docker + nginx-proxy (ver apps/appi/docker-compose.yml)
      # Despliegue a appi.droni.vip
      # TODO: Configurar según tu servidor:
      #   - SSH + docker compose pull && docker compose up -d
      #   - Push imagen a registry + webhook al servidor
      - name: Deploy (pendiente de configurar)
        run: echo "Deploy de appi pendiente de configurar"
