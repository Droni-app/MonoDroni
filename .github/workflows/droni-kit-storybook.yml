name: droni-kit Storybook to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/droni-kit/**'
      - '.github/workflows/droni-kit-storybook.yml'

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: packages/droni-kit

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: bitovi/github-actions-storybook-to-github-pages@v1.0.3
        with:
          path: storybook-static
          checkout: false
          install_command: npm i --prefix packages/droni-kit
          build_command: npm run build-storybook --prefix packages/droni-kit
