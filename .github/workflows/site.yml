name: Site CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'packages/droni-kit/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/site/**'
      - 'packages/droni-kit/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cachea desde la raíz del monorepo
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install all workspace dependencies
        run: npm ci

      - name: Build droni-kit (dependency)
        working-directory: packages/droni-kit
        run: npm run build

      - name: Build site
        working-directory: apps/site
        run: npm run build
        env:
          # Agrega aquí las variables de entorno necesarias
          NODE_ENV: production
          # NUXT_PUBLIC_APPI: ${{ secrets.APPI_URL }}
          # NUXT_PUBLIC_APPI_SITE_ID: ${{ secrets.APPI_SITE_ID }}

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: apps/site/.output/
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: .output/

      # TODO: Configurar deploy según tu infraestructura
      - name: Deploy (pendiente de configurar)
        run: echo "Deploy de site pendiente de configurar"
